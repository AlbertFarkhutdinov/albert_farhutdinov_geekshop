[project]
name = "shop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0"
authors = [
    {name = "AlbertFarkhutdinov",email = "albertfarhutdinov@gmail.com"}
]
dependencies = [
    "django (<5.3)",
    "django-debug-toolbar (<6.1)",
    "django-debug-toolbar-template-profiler (<2.2)",
    "django-extensions (<4.2)",
    "pillow (<12.0)",
    "psycopg2 (<2.10)",
    "social_auth_app_django (<5.6)",
]

[dependency-groups]
dev = [
    "pytest<9.0",
    "pytest-cov<8.0",
    "ruff<0.13",
    "wemake-python-styleguide<1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
