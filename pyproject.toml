[project]
name = "shop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0"
authors = [
    {name = "AlbertFarkhutdinov",email = "albertfarhutdinov@gmail.com"}
]
dependencies = [
    "django (<6.0)",
    "django-debug-toolbar (<6.4)",
    "django-debug-toolbar-template-profiler (<2.2)",
    "django-extensions (<4.2)",
    "pillow (<12.3)",
    "psycopg2 (<2.10)",
    "social_auth_app_django (<6.0)",
]

[dependency-groups]
dev = [
    "pytest (<10.0)",
    "pytest-cov<8.0",
    "ruff (<1.0)",
    "wemake-python-styleguide (<2.0)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
